# ==========================================
# GLOBAL & DEFAULT CONFIGURATION (PRODUCTION)
# ==========================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  profiles:
    active: prod # Set production as the default profile for cloud deployment
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES}
    template:
      retry:
        enabled: true
        initial-interval: 3000ms
        max-attempts: 3
    listener:
      simple:
        initialize-consumers: true
---
# ==========================================
# OVERRIDES FOR LOCAL DEVELOPMENT ENVIRONMENT
# ==========================================
spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/user_service_db?useSSL=false&serverTimezone=UTC
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
      format_sql: true
      highlight_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    
  logging:
    level:
    org.hibernate.orm.queries: trace

