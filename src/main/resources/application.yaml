# ==========================================
# GLOBAL & DEFAULT CONFIGURATION (PRODUCTION)
# ==========================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: always

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  rabbitmq:
    # 🔴 O ":-" diz ao Spring: se a variável não existir na máquina, usa NULL em vez de crashar
    addresses: ${SPRING_RABBITMQ_ADDRESSES:-}
    template:
      retry:
        enabled: true
        initial-interval: 3000ms
        max-attempts: 3
    listener:
      simple:
        initialize-consumers: true

---
# ==========================================
# OVERRIDES FOR LOCAL DEVELOPMENT ENVIRONMENT
# ==========================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/user_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: rootroot

  rabbitmq:
    # Garanta que estas propriedades limpam o valor global e apontam para o localhost
    addresses: null
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
